api_test:
  host: '{{.API_HOST}}'
  network_enable: true
  name: order_workflow
  global_hook:
    after:
      workflows:
      - step: cleanup_order
        request:
          method: DELETE
          uri: /api/merchants/{{.mid}}/orders/{{.order_id}}
        expect_response:
          code: SUCCESS
          status_code: 200
  skip: false
  scenarios:
  - skip: false
    name: order_workflow
    workflows:
    - step: create_order
      request:
        vars:
        - name: mid
        method: POST
        uri: /api/merchants/{{.mid}}/orders
        headers: '{"Content-Type":"application/json"}'
        body: '{"items":[{"name":"Test Item","price":{"cents":100,"currency_iso":"HKD"},"quantity":1}]}'
      expect_response:
        code: SUCCESS
        status_code: 200
        body:
          presents:
          - field: data.id
