version: 2

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - generated

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - revive
    - ineffassign
    - misspell
    - gocritic

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number 